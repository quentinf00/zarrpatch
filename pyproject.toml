[project]
authors = [{name = "Quentin Febvre", email = "quentin.febvre@gmail.com"}]
description = "Fast patch sampling from Zarr / netCDF / HDF5 cubes for PyTorch training"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.4.6,<3",
    "zarr>=3,<4",
]
name = "zarrpatch"
requires-python = ">=3.11,<3.13"
version = "0.1.0"

[project.urls]
Homepage = "https://github.com/quentinf00/zarrpatch"
Repository = "https://github.com/quentinf00/zarrpatch"
Issues = "https://github.com/quentinf00/zarrpatch/issues"

[project.optional-dependencies]
torch = ["torch>=2.12,<3"]
netcdf = ["netCDF4>=1.7.4,<2"]
kerchunk = [
    "fsspec",
    "kerchunk>=0.2.10,<0.3",
]
hdf5 = [
    "h5py>=3.16,<4",
    "torch>=2.12,<3",
]
lightning = [
    "lightning>=2,<3",
    "torch>=2.12,<3",
]
tensorstore = ["tensorstore>=0.1.70"]
all = [
    "fsspec",
    "h5py>=3.16,<4",
    "kerchunk>=0.2.10,<0.3",
    "lightning>=2,<3",
    "netCDF4>=1.7.4,<2",
    "tensorstore>=0.1.70",
    "torch>=2.12,<3",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.package]
name = "zarrpatch"
version = "0.1.0"
license = "Apache-2.0"
license-file = "LICENSE"
homepage = "https://github.com/quentinf00/zarrpatch"
repository = "https://github.com/quentinf00/zarrpatch"

[tool.pixi.package.build.backend]
name = "pixi-build-python"
version = "*"
channels = ["conda-forge"]

[tool.pixi.package.host-dependencies]
hatchling = "*"

[tool.pixi.package.run-dependencies]
python = ">=3.11,<3.13"

[tool.pixi.package.build.config]
ignore-pypi-mapping = false

[tool.pixi.pypi-dependencies]
zarrpatch = { path = ".", editable = true }

[tool.pixi.activation]
scripts = ["scripts/load_env.sh"]

[tool.pixi.tasks]
test = "pytest tests -q"
bench = "python benchmarks/run_bench.py"

[tool.pixi.feature.lightning.dependencies]
lightning = ">=2.0"

[tool.pixi.feature.torch.dependencies]
pytorch-cpu = ">=2.12.1,<3"

[tool.pixi.feature.backends.dependencies]
netcdf4 = ">=1.7.4,<2"
kerchunk = ">=0.2.10,<0.3"
h5py = ">=3.16.0,<4"
tensorstore = ">=0.1.70"

[tool.pixi.feature.test.dependencies]
pytest = ">=9.1.1,<10"
xarray = ">=2026.7.0,<2027"
dask = ">=2026.7.1,<2027"
rich = ">=15.0.0,<16"
ujson = ">=5.13.0,<6"

[tool.pixi.feature.ecosystem.tasks]
ecosystem-bench = "python benchmarks/ecosystem_bench.py"

[tool.pixi.feature.ecosystem.dependencies]
xbatcher = ">=0.4"

[tool.pixi.environments]
default = ["torch", "backends", "test"]
lightning = ["torch", "backends", "test", "lightning"]
ecosystem = ["torch", "backends", "test", "ecosystem"]

[tool.pixi.dependencies]
python = ">=3.11,<3.13"
